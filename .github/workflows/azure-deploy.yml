# Builds the site and deploys it to Azure App Service (Linux, Node 22, Central India).
# Sign-in uses GitHub's OIDC token and an Azure app registration (no stored Azure password); see
# scripts/azure/setup-webapp.sh. Repository variables hold the non-secret IDs and settings; secrets hold the rest.
name: Deploy to Azure

on:
  push:
    # feat/paid-funnel deploys too until the domain moves to Azure, so the Azure copy can be checked before the merge.
    # Remove it (and its federated credential) after the switch.
    branches: [main, feat/paid-funnel]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}

      - name: Package the standalone server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cd .next/standalone && zip -qr ../../site.zip .

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Settings are written on every deploy from GitHub variables and secrets; an empty one is left as it is in Azure.
      - name: App settings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          PACK_CONTAINER: ${{ vars.PACK_CONTAINER }}
          PACK_BLOB_PATH: ${{ vars.PACK_BLOB_PATH }}
          RAZORPAY_MODE: ${{ vars.RAZORPAY_MODE }}
          RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          settings=(HOSTNAME=0.0.0.0 SCM_DO_BUILD_DURING_DEPLOYMENT=false)
          for name in DATABASE_URL AZURE_STORAGE_ACCOUNT AZURE_STORAGE_KEY PACK_CONTAINER PACK_BLOB_PATH RAZORPAY_MODE \
            RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET ADMIN_API_TOKEN RESEND_API_KEY SITE_URL \
            GOOGLE_SITE_VERIFICATION; do
            if [ -n "${!name}" ]; then settings+=("$name=${!name}"); fi
          done
          az webapp config appsettings set -g rg-chisokulabs-website -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings "${settings[@]}" -o none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: site.zip

      - name: Smoke test
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/") || true
            if [ "$code" = 200 ]; then echo "Home page: 200"; break; fi
            sleep 10
          done
          [ "$code" = 200 ] || { echo "Home page did not answer 200 (last: $code)"; exit 1; }
          for path in /readiness /pricing /terms /robots.txt /sitemap.xml; do
            echo "$path: $(curl -s -o /dev/null -w '%{http_code}' "$url$path")"
          done
