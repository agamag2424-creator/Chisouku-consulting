# Builds the site and deploys it to Azure App Service (Linux, Node 22, Central India).
# Sign-in uses GitHub's OIDC token and an Azure app registration (no stored Azure password). The IDs below are not
# secrets. The site's settings (database, keys) live in the web app's Environment variables in Azure, set by
# scripts/azure/setup-webapp.sh; change them in the Azure portal, not here.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: chisokulabs-web-318661
  AZURE_CLIENT_ID: 9f5838d2-acaf-4579-933a-87673d9e9246
  AZURE_TENANT_ID: 5ebdbe14-12b5-46a3-9f9c-bfe87b039e90
  AZURE_SUBSCRIPTION_ID: 5a5789b0-1e46-4189-b0ce-4e57323f492f

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Turbopack fails in GitHub Actions while rewriting next/font Google CSS
        # (ibm_plex_sans: "queries have exactly one entry"). Webpack downloads the
        # same fonts and produces the standalone server Azure deploys. Vercel keeps
        # its own build and is unaffected.
        run: npx next build --webpack
        env:
          GOOGLE_SITE_VERIFICATION: sFP9aPJdlXb8tevdRl8QQsNKjQzTdYV5U7DdwHA8g1k

      - name: Package the standalone server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cd .next/standalone && zip -qr ../../site.zip .

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        # OneDeploy keeps files the new zip does not contain. Next.js stores a
        # route cache under .next/server/route-cache, keyed by the route path,
        # and writes it at runtime. After #119 that cache still held the 4 Nov
        # Turbopack HTML, so /pricing and /independence-and-data kept serving
        # the previous build. --clean removes wwwroot before the new package.
        run: |
          az webapp deploy \
            --resource-group rg-chisokulabs-website \
            --name "$AZURE_WEBAPP_NAME" \
            --src-path site.zip \
            --type zip \
            --clean true \
            --restart true \
            --async false

      - name: Smoke test
        run: |
          url="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/") || true
            if [ "$code" = 200 ]; then echo "Home page: 200"; break; fi
            sleep 10
          done
          [ "$code" = 200 ] || { echo "Home page did not answer 200 (last: $code)"; exit 1; }
          for path in /readiness /pricing /terms /robots.txt /sitemap.xml; do
            echo "$path: $(curl -s -o /dev/null -w '%{http_code}' "$url$path")"
          done
          # A 200 is not enough: the previous deploy kept serving the 4 Nov HTML.
          expect_build() {
            path="$1"
            needle="$2"
            banned="$3"
            for i in $(seq 1 18); do
              body=$(curl -fsS "$url$path" || true)
              if printf '%s' "$body" | grep -Fq "$needle" && ! printf '%s' "$body" | grep -Eq "$banned"; then
                echo "$path: this build"
                return 0
              fi
              sleep 10
            done
            echo "$path: still serving the previous build"
            exit 1
          }
          expect_build /independence-and-data "17 November 2026" "17 October 2026|Readiness Evidence Check|Go-Live Decision Review"
          expect_build /pricing "PMO Health Check" "Readiness Evidence Check|Go-Live Decision Review|Continuous readiness|readiness brief"
